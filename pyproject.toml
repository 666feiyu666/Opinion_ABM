[project]
name = "opinion-abm"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.10,<4",
    "networkx>=3.4,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scipy>=1.15,<2",
    "seaborn>=0.13,<0.14",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "ipython>=8.30,<10",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
]
